name: Run Unit Tests

on:
  push:
    branches:
      - main
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/unit-test.yml'
  pull_request:
    branches:
      - main
      - development
    paths:
      - 'packages/frontend/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/unit-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Pin to Node 22. `lts/*` now resolves to Node 26, and better-sqlite3
          # 12.6.2 does not compile against that V8 (PropertyCallbackInfo::This
          # was removed). Node 22 matches the engines field and has prebuilds.
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm -F @hanafuda/frontend test
