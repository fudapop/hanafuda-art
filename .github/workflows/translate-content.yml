# Translate English content and UI strings when they change on main.
#
# The job never pushes to main. It writes locale files on `i18n/update-translations`
# and opens a pull request for review. Squash-merge that pull request.
#
# Incremental runs retranslate only changed markdown sections and UI strings
# whose English text changed, plus UI keys that are still missing in a locale
# file this range edited. Manual runs default to changed mode and require a
# base_ref (commit or tag before the English changes). Full backfills are opt-in.
# For a safe preview, enable dry_run with either mode.
#
# If i18n/update-translations is already open, the next run includes both the
# requested range and that branch's merge-base with HEAD, and merges its locale
# edits into the current files. A reviewed fix on main stays. A newer push cannot drop
# translations that are still waiting for review. --plan does not write files.
#
# The pull request is opened with the TRANSLATE_PR_TOKEN secret: a fine-grained
# PAT or GitHub App token with contents and pull-requests write on this
# repository. The default GITHUB_TOKEN does not start the required pull_request
# workflows, so the job skips Vertex and the pull request when the secret is unset.
#
# Removing a locale from localization.json does not delete its files.
# Adding a locale plans a full translation for that locale only.
#
# The workflow skips, with a notice, until these repository variables exist
# (Settings → Secrets and variables → Actions → Variables):
#
#   GCP_WORKLOAD_IDENTITY_PROVIDER   shared with the other GCP workflows
#     projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_PROJECT_ID                   shared with the other GCP workflows
#     PROJECT_ID
#   GCP_TRANSLATE_SERVICE_ACCOUNT    this workflow only
#     hanafuda-github-translate@PROJECT_ID.iam.gserviceaccount.com
#
# Firestore deploy uses GCP_FIRESTORE_DEPLOY_SERVICE_ACCOUNT. Keep the
# translate account in its own variable so the two cannot be mixed.
#
# Optional variables:
#
#   GCP_LOCATION   default us-central1. Use global for a global Gemini endpoint.
#   GCP_MODEL      default gemini-2.5-flash
#
# The foundation Terraform change adds the service account below and wires it to
# the shared workload identity pool. This workflow only reads that account from
# GCP_TRANSLATE_SERVICE_ACCOUNT. It does not create cloud resources. The pool
# and provider stay locked to fudapop/hanafuda-art.
#
#   API: aiplatform.googleapis.com
#   Service account: hanafuda-github-translate
#   Role on the project: roles/aiplatform.user
#     (permission used: aiplatform.endpoints.predict)
#   Binding on that service account:
#     role: roles/iam.workloadIdentityUser
#     member: principalSet://iam.googleapis.com/projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL/attribute.repository/fudapop/hanafuda-art
#
# The google-github-actions/auth action requests an OIDC token whose audience
# is the provider resource name. The provider's audience must allow that.
# Repository Actions permissions must let this workflow create a branch and a
# pull request (contents: write and pull-requests: write on the job).
#
# Translation pull requests should not add a changelog bullet. They translate
# English that already describes the player-facing change. The English
# changelog remains the source of truth.

name: Translate content

on:
  push:
    branches:
      - main
    paths:
      - 'packages/frontend/content/en/**'
      - 'packages/frontend/i18n/locales/en-us.json'
      - 'packages/frontend/localization.json'
  workflow_dispatch:
    inputs:
      mode:
        description: Incremental changes or a full retranslation of every English source
        type: choice
        default: changed
        options:
          - changed
          - full
      base_ref:
        description: Commit or tag before the English changes (required for changed mode; pending PRs may extend this range)
        type: string
        required: false
      dry_run:
        description: Print the selected translation plan and skip Vertex AI and the pull request
        type: boolean
        default: false

# A second push waits. Cancelling mid-translation would leave a half-updated branch.
concurrency:
  group: i18n-translate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pending translation branch
        run: git fetch --no-tags origin i18n/update-translations:refs/remotes/origin/i18n/update-translations || true

      - name: Resolve translation range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          BASE_REF: ${{ inputs.base_ref }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          MODE=changed
          BASE_SHA="$PUSH_BASE_SHA"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$REQUESTED_MODE"
            BASE_SHA=
            case "$MODE" in
              changed)
                if [ -z "$BASE_REF" ]; then
                  echo "::error::base_ref is required for a manual incremental run. Choose a commit or tag before the English changes."
                  exit 1
                fi
                if ! BASE_SHA=$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}"); then
                  echo "::error::base_ref must resolve to an existing commit or tag."
                  exit 1
                fi
                if ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"; then
                  echo "::error::base_ref must be an ancestor of the selected workflow commit."
                  exit 1
                fi
                ;;
              full) ;;
              *)
                echo "::error::mode must be changed or full."
                exit 1
                ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Plan translations
        id: plan
        env:
          MODE: ${{ steps.range.outputs.mode }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -eu
          ARGS=(--mode "$MODE" --plan --github-output "$GITHUB_OUTPUT")
          if [ "$MODE" = "changed" ]; then
            ARGS+=(--base "$BASE_SHA" --head "$HEAD_SHA" --pending-ref origin/i18n/update-translations)
          fi
          node --experimental-strip-types scripts/i18n-translate.ts "${ARGS[@]}"

      - name: Check translation identity
        id: identity
        if: steps.plan.outputs.count != '0' && github.event.inputs.dry_run != 'true'
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_TRANSLATE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -eu
          if [ -z "$PROVIDER" ] || [ -z "$SERVICE_ACCOUNT" ] || [ -z "$PROJECT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Translation skipped::Set repository variables GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_TRANSLATE_SERVICE_ACCOUNT, and GCP_PROJECT_ID to open a translation pull request. Vertex AI was not called. The service account, role, and API are documented at the top of .github/workflows/translate-content.yml."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check pull request token
        id: pr-token
        if: steps.identity.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.TRANSLATE_PR_TOKEN }}
        run: |
          set -eu
          if [ -z "$TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Translation pull request skipped::Set the TRANSLATE_PR_TOKEN secret to a fine-grained PAT or GitHub App token with contents and pull-requests write. The default GITHUB_TOKEN does not start required CI on the translation pull request, so Vertex AI was not called."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        id: auth
        if: steps.identity.outputs.ready == 'true' && steps.pr-token.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_TRANSLATE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Translate
        if: steps.identity.outputs.ready == 'true' && steps.pr-token.outputs.ready == 'true'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_LOCATION: ${{ vars.GCP_LOCATION || 'us-central1' }}
          GCP_MODEL: ${{ vars.GCP_MODEL || 'gemini-2.5-flash' }}
          MODE: ${{ steps.range.outputs.mode }}
          BASE_SHA: ${{ steps.range.outputs.base }}
          HEAD_SHA: ${{ steps.range.outputs.head }}
        run: |
          set -eu
          ARGS=(--mode "$MODE")
          if [ "$MODE" = "changed" ]; then
            ARGS+=(--base "$BASE_SHA" --head "$HEAD_SHA" --pending-ref origin/i18n/update-translations)
          fi
          node --experimental-strip-types scripts/i18n-translate.ts "${ARGS[@]}"

      - name: Open translation pull request
        if: steps.identity.outputs.ready == 'true' && steps.pr-token.outputs.ready == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TRANSLATE_PR_TOKEN }}
          branch: i18n/update-translations
          base: main
          commit-message: 'chore(i18n): update translations'
          title: 'chore(i18n): update translations'
          add-paths: |
            packages/frontend/content/**
            packages/frontend/i18n/locales/**
          delete-branch: true
          body: |
            Automated translation of English content and UI strings that changed on `main`.

            Locales: ja, pl, ru, fr. A person should review the wording before merging. This branch is not applied directly to `main`.

            No changelog bullet. These files translate English that already describes the player-facing change. The English changelog stays the source of truth, and a new bullet here would need another translation pass.

            Confirm English sources under `packages/frontend/content/en` and `packages/frontend/i18n/locales/en-us.json` are untouched. Check glossary terms (yaku names, Koi-Koi, card names) and that placeholders, links, and front matter survived.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
